services:
  postgresql:
    image: postgres:16-alpine
    container_name: questforge-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-questforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-questforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - questforge-net

  minio:
    image: minio/minio:latest
    container_name: questforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no arquivo .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no arquivo .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - questforge-net

  ollama:
    image: ollama/ollama:latest
    container_name: questforge-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Nenhum modelo grande é baixado automaticamente na inicialização do container.
    # O healthcheck valida apenas se o daemon HTTP do Ollama está respondendo.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - questforge-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: questforge-backend
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3333}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      # Comunicação interna via DNS da rede Docker usando o serviço `postgresql`
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-questforge}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}
      # Comunicação interna via DNS da rede Docker usando os serviços `ollama` e `minio`
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-questforge-documents}
      MINIO_USE_SSL: "false"
    ports:
      - "${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT || 3333) + '/api/health').then(r => process.exit((r.status === 200 || r.status === 503) ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - questforge-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: questforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_TARGET: http://backend:${BACKEND_PORT:-3333}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - questforge-net

volumes:
  postgres_data:
  minio_data:
  ollama_data:

networks:
  questforge-net:
    driver: bridge
